name: Build Minke for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Locate the Makefile by content rather than assuming its path. PREPROCESSOR_SRC is
      # a variable name unique to Minke's Makefile.
      - name: Locate Minke Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(find . -iname "Makefile" -exec grep -l "PREPROCESSOR_SRC" {} \; | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'PREPROCESSOR_SRC' was found."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "makefile_dir=$MAKEFILE_DIR" >> "$GITHUB_OUTPUT"

      # `evalfile_processed` compiles tools/preprocess_nnue.cpp and then EXECUTES it to
      # permute the network's FT weight layout for the target SIMD width. Unlike Halogen's
      # verbatim.cpp, this tool's simd.h ties the needed constants (PACKUS_LANE_COUNT etc.)
      # into the same #if block as real ARM NEON types (uint8x16_t, ...) -- so there's no
      # way to build a host-runnable-but-NEON-correct version of it by choosing flags; the
      # permutation is genuinely architecture-specific data. QEMU user-mode emulation lets
      # the real ARM-compiled tool execute transparently on this x86_64 runner instead.
      - name: Install QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          echo "--- binfmt_misc entries (authoritative regardless of registration mechanism) ---"
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64 || echo "no aarch64 entry found yet"
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "handler not present under that exact name -- will confirm by actually running an ARM binary later in the build"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Locate NDK aarch64 clang++
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep "aarch64-linux-android24-clang++"
          "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" --version

      # A fully-static Android binary (-static-pie) has no dynamic linker, so libunwind's
      # dl_iterate_phdr reference is unresolved -- Android's static libc doesn't provide it,
      # only the dynamic linker does. Dynamic linking isn't an option here either: QEMU
      # would need to open Android's real dynamic linker at /system/bin/linker64, which
      # doesn't exist on this Ubuntu runner (confirmed by the exact failure just seen).
      # This provides a minimal but CORRECT implementation for the static-pie case: a fully
      # static binary is its own only "module", so its program headers (located via the
      # linker-provided __ehdr_start symbol) are all libunwind actually needs.
      - name: Build dl_iterate_phdr stub for static PIE
        id: dl-phdr-stub
        run: |
          STUB_DIR="$RUNNER_TEMP/android-stub-libs"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/dl_iterate_phdr_stub.cpp" << 'EOF'
          #include <link.h>
          #include <elf.h>

          extern "C" {
              extern const Elf64_Ehdr __ehdr_start;
          }

          extern "C" int dl_iterate_phdr(int (*callback)(struct dl_phdr_info *info, size_t size, void *data), void *data) {
              struct dl_phdr_info info;
              info.dlpi_addr = 0;
              info.dlpi_name = "";
              info.dlpi_phdr = reinterpret_cast<const Elf64_Phdr*>(
                  reinterpret_cast<const char*>(&__ehdr_start) + __ehdr_start.e_phoff);
              info.dlpi_phnum = __ehdr_start.e_phnum;
              return callback(&info, sizeof(info), data);
          }
          EOF
          "${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            -std=c++20 -march=armv8-a -c "$STUB_DIR/dl_iterate_phdr_stub.cpp" -o "$STUB_DIR/dl_iterate_phdr_stub.o"
          echo "stub_obj=$STUB_DIR/dl_iterate_phdr_stub.o" >> "$GITHUB_OUTPUT"

      - name: Build Minke (arm64, armv8-a)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make build \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            ARCH_FLAGS="-DUSE_NEON -DUSE_SIMD -march=armv8-a" \
            BUILD_DIR=build/android \
            EXE=minke-android \
            LDFLAGS="-flto=auto -static-pie ${{ steps.dl-phdr-stub.outputs.stub_obj }}"

      - name: Confirm binary is PIE and has no shared library dependencies
        run: |
          BIN="${{ steps.locate-makefile.outputs.makefile_dir }}/minke-android"
          find "${{ steps.locate-makefile.outputs.makefile_dir }}" -maxdepth 1 -iname "minke*" -type f
          file "$BIN"
          echo "--- ELF header type ---"
          readelf -h "$BIN" | grep -i type
          echo "--- Dynamic section (should show no NEEDED entries) ---"
          readelf -d "$BIN" || echo "readelf reports no dynamic section -- fully static, good"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: minke-android-arm64
          path: ${{ steps.locate-makefile.outputs.makefile_dir }}/minke-android
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Minke Android build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.locate-makefile.outputs.makefile_dir }}/minke-android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
