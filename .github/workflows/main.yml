name: Minke Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Minke for Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Patch Source Files and Makefile
        run: |
          # 1. Remove -march=native globally from Makefiles to prevent cross-compilation errors
          sed -i 's/-march=native//g' Makefile makefile 2>/dev/null || true

          # 2. Force the preprocess_nnue recipe to use host g++ and include src headers
          python3 -c '
          for fn in ["Makefile", "makefile"]:
              try:
                  with open(fn, "r") as f:
                      content = f.read()
                  
                  lines = content.splitlines()
                  new_lines = []
                  capturing = False
                  for line in lines:
                      if line.startswith("preprocess_nnue:"):
                          capturing = True
                          new_lines.append(line)
                          continue
                      if capturing:
                          if line.startswith("\t") or line.startswith("    "):
                              # Replace any cross-compiler call with host g++ and add -Isrc
                              fixed_line = line.replace("$(CXX)", "g++").replace("${CXX}", "g++")
                              if "g++" in fixed_line and "-Isrc" not in fixed_line:
                                  fixed_line = fixed_line.replace("g++", "g++ -std=c++17 -Isrc")
                              new_lines.append(fixed_line)
                          else:
                              capturing = False
                              new_lines.append(line)
                      else:
                          new_lines.append(line)
                  
                  with open(fn, "w") as f:
                      f.write("\n".join(new_lines) + "\n")
                  print(f"Successfully patched preprocess_nnue in {fn}")
                  break
              except FileNotFoundError:
                  continue
          '

          # 3. Ensure all source files using stringstream explicitly include <sstream>
          for f in $(find src -name "*.cpp"); do
            if grep -q "stringstream" "$f" && ! grep -q "#include <sstream>" "$f"; then
              echo "Adding #include <sstream> to $f"
              sed -i '1i #include <sstream>' "$f"
            fi
          done

      - name: Build Minke for Android ARM64
        run: |
          TOOLCHAIN=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          make \
            CXX=$TOOLCHAIN/aarch64-linux-android29-clang++ \
            CXXFLAGS="-O3 -funroll-loops -march=armv8-a -flto=auto" \
            ARCH_FLAGS="-DUSE_NEON -DUSE_SIMD -march=armv8-a" \
            BUILD_DIR=build/android \
            EXE=build/minke \
            build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minke-Android-arm64
          path: build/minke
          retention-days: 7
